# =============================================================================
#  ALPHA.5 PRO — PUBLIC HTTP GATEWAY  (bare-IP access, NO TLS)
# =============================================================================
#  A full nginx.conf (not a conf.d snippet) for the compose service `nginx-http`
#  (profile: http). Mounted READ-ONLY at /etc/nginx/nginx.conf — there is NO
#  envsubst/template step here, because with no domain there is nothing to
#  substitute.
#
#  WHY HTTP-ONLY
#    The platform is reachable at  http://91.99.71.111  immediately, with no
#    domain and no certificate. Let's Encrypt cannot issue a certificate for a
#    bare IP address, so TLS is impossible in this mode.
#
#  UPGRADE TO HTTPS LATER (when you have a domain)
#    1. point DNS A/AAAA at this host,
#    2. docker compose -f docker-compose.prod.yml stop nginx-http   # free :80
#    3. ./deploy.sh --edge      # bundled nginx + certbot (infra/nginx/nginx.conf)
#    Both gateways want :80, so exactly ONE runs at a time.
#
#  ROUTING  (upstreams are COMPOSE SERVICE NAMES on the `radar_network` bridge;
#  a stale name like `ai-engine:8001` 502s every predict — keep in lockstep
#  with docker-compose.prod.yml `expose:` ports):
#      /                -> client-app:3000   (Next.js custom server)
#      /api/v1/         -> core-backend:4000 (Express + Prisma)
#      /socket.io/      -> core-backend:4000 (Socket.IO; WebSocket upgrade)
#      /ai/             -> ai-engine:8000    (FastAPI; /ai/ prefix stripped)
#      /health          -> core-backend:4000 (root health router)
#      /nginx-health    -> static 200        (container healthcheck)
# =============================================================================

user  nginx;
worker_processes  auto;
pid /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct=$upstream_connect_time '
                      'uht=$upstream_header_time urt=$upstream_response_time';
    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;

    # ── Transport tuning ──────────────────────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    server_tokens       off;                 # never advertise the nginx version
    client_max_body_size 8m;
    types_hash_max_size 2048;

    # ── Compression (never gzip the WebSocket upgrade) ────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        application/vnd.api+json
        application/manifest+json
        application/x-javascript
        image/svg+xml
        font/woff2;

    # ── WebSocket upgrade map ─────────────────────────────────────────────────
    # Emits "upgrade" only for genuine upgrade requests and "close" otherwise,
    # which is REQUIRED: hard-coding `Connection upgrade` on every /socket.io/
    # request corrupts the initial HTTP long-polling handshake.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Defensive edge rate limit (in front of the backend's own limiter) ─────
    limit_req_zone $binary_remote_addr zone=api_rl:10m rate=30r/s;
    limit_req_status 429;

    # ── Upstreams ─────────────────────────────────────────────────────────────
    upstream backend {
        server core-backend:4000;
        keepalive 32;
    }
    upstream ai_engine {
        server ai-engine:8000;
        keepalive 16;
    }
    upstream frontend {
        server client-app:3000;
        keepalive 32;
    }

    # =========================================================================
    #  HTTP :80 — the whole application (no redirect: there is no HTTPS yet)
    # =========================================================================
    server {
        listen      80;
        listen      [::]:80;
        # Catch-all: answers for the bare IP AND any Host header / future name.
        server_name _;

        # HTTP security headers only. HSTS is intentionally OMITTED — it is a
        # no-op over plain HTTP and a preload header here would be harmful.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "DENY" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy     "geolocation=(), microphone=(), camera=(), payment=()" always;
        # Same origin + the WS scheme. No 'unsafe-eval' (that is what injected
        # scripts abuse); inline style/script is required by the Next.js
        # hydration bootstrap.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; manifest-src 'self'; worker-src 'self' blob:" always;

        # Container healthcheck probe (answered on :80 by nginx itself).
        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # ── Core backend REST API ─────────────────────────────────────────────
        # `proxy_pass http://backend;` (no URI part) preserves the full path,
        # so /api/v1/signals reaches the backend unchanged.
        location /api/v1/ {
            limit_req zone=api_rl burst=60 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Empty Connection keeps the upstream keepalive pool usable.
            proxy_set_header Connection        "";
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # Root health namespace (autopilot probes /health, /health/ai, ...).
        location /health {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
            access_log off;
        }

        # ── Socket.IO (WebSocket + polling) ───────────────────────────────────
        # Long timeouts + buffering off; the $connection_upgrade map emits the
        # correct Connection header for both the polling handshake and the WS
        # upgrade.
        location /socket.io/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering   off;
            proxy_cache       off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── AI engine (FastAPI) ───────────────────────────────────────────────
        # Trailing slash on proxy_pass STRIPS the matched `/ai/` prefix:
        #   /ai/api/v1/predict  ->  http://ai-engine:8000/api/v1/predict
        # Mirrors the client-app/server.js proxy so browser and SSR agree.
        location /ai/ {
            proxy_pass http://ai_engine/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
            proxy_read_timeout 120s;
        }

        # ── Frontend (Next.js) — catch-all LAST ───────────────────────────────
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_read_timeout 120s;
        }
    }
}
