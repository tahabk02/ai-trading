# =============================================================================
#  ALPHA.5 PRO — PRODUCTION EDGE (nginx reverse proxy + TLS termination)
# =============================================================================
#  This file is a FULL nginx.conf (not a conf.d snippet). It is mounted into
#  the `nginx` service as /etc/nginx/nginx.conf.template and rendered at
#  container start with:
#
#      envsubst '$DOMAIN' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf
#
#  envsubst is RESTRICTED to $DOMAIN on purpose: nginx's own variables
#  ($host, $remote_addr, $http_upgrade, $connection_upgrade, ...) must survive
#  the substitution untouched. Only ${DOMAIN} is rewritten.
#
#  Requires nginx >= 1.25.1 (for the `http2 on;` directive). The bundled
#  compose `edge` profile pins nginx:1.27-alpine.
#
#  Topology (all upstreams are compose service names on `radar_network`):
#      /                -> client-app:3000   (Next.js custom server)
#      /api/v1/         -> core-backend:4000 (Express + Prisma)
#      /socket.io/      -> core-backend:4000 (Socket.IO; WS upgrade)
#      /ai/             -> ai-engine:8000    (FastAPI; /ai/ prefix stripped)
#      /health, /api/healthz -> core-backend / client-app liveness
#
#  The upstream server names are intentionally the COMPOSE SERVICE NAMES. A
#  common outage is an old config pointing `/ai/` at `ai-engine:8001` while
#  the engine actually listens on 8000 — every predict then 502s. Keep these
#  in lockstep with docker-compose.prod.yml (`expose:` ports).
# =============================================================================

user  nginx;
worker_processes  auto;
pid /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────────
    # `main` includes the upstream timings so a 502/504 can be told apart from
    # an application 500 without leaving the access log.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct=$upstream_connect_time '
                      'uht=$upstream_header_time urt=$upstream_response_time';
    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;

    # ── Transport tuning ──────────────────────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    server_tokens       off;                 # never advertise the nginx version
    client_max_body_size 8m;
    types_hash_max_size 2048;

    # ── Compression ───────────────────────────────────────────────────────────
    # Socket.IO frames are binary and already excluded by gzip_types; never
    # gzip the WS upgrade.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        application/vnd.api+json
        application/manifest+json
        application/x-javascript
        image/svg+xml
        font/woff2;

    # ── WebSocket upgrade map ─────────────────────────────────────────────────
    # Emits "upgrade" only for genuine upgrade requests and "close" otherwise,
    # which is REQUIRED: hard-coding `Connection "upgrade"` on every
    # /socket.io/ request corrupts the initial HTTP long-polling handshake.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Defensive edge rate limit ─────────────────────────────────────────────
    # A coarse per-IP ceiling in FRONT of the backend's own limiter (which
    # measures by real client IP via X-Forwarded-For). 30 r/s with a 60-request
    # burst is far above any legitimate 1 Hz dashboard + polling cadence.
    limit_req_zone $binary_remote_addr zone=api_rl:10m rate=30r/s;
    limit_req_status 429;

    # ── Upstreams ─────────────────────────────────────────────────────────────
    upstream backend {
        server core-backend:4000;
        keepalive 32;
    }
    upstream ai_engine {
        server ai-engine:8000;
        keepalive 16;
    }
    upstream frontend {
        server client-app:3000;
        keepalive 32;
    }

    # =========================================================================
    #  HTTP :80 — ACME webroot + permanent redirect to HTTPS
    # =========================================================================
    server {
        listen      80;
        listen      [::]:80;
        server_name ${DOMAIN};

        # Let's Encrypt HTTP-01 challenge (webroot). Served from the shared
        # certbot_www volume; must NOT redirect or the challenge fails.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Container healthcheck probe — stays on :80 so it does not depend on a
        # valid certificate existing yet (bootstrap).
        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================================
    #  HTTPS :443 — TLS termination + application routing
    # =========================================================================
    server {
        listen      443 ssl;
        listen      [::]:443 ssl;
        http2       on;
        server_name ${DOMAIN};

        # Certs are provisioned into the shared certbot_certs volume. deploy.sh
        # issues the FIRST certificate with `certbot certonly --standalone`
        # BEFORE this container starts (so :80 is free), then starts nginx with
        # the real lineage already present. Renewals are handled by the certbot
        # service via the webroot below — no placeholder needed.
        ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;
        ssl_session_tickets       off;

        # ── Security headers ──────────────────────────────────────────────────
        # CSP allows same-origin + the WS scheme, and inline styles/scripts that
        # Next.js's hydration bootstrap requires. It deliberately does NOT allow
        # 'unsafe-eval' — that is the directive browser extensions and injected
        # scripts abuse. `frame-ancestors 'none'` supersedes X-Frame-Options but
        # both are sent for old clients.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Content-Security-Policy   "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' wss: https:; manifest-src 'self'; worker-src 'self' blob:; upgrade-insecure-requests" always;

        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # ACME over TLS as well, so a renewal works even if :80 is briefly down.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # ── Core backend REST API ─────────────────────────────────────────────
        # `proxy_pass http://backend;` (no URI part) preserves the full request
        # path, so /api/v1/signals reaches the backend unchanged.
        location /api/v1/ {
            limit_req zone=api_rl burst=60 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Empty Connection keeps the upstream keepalive pool from the
            # `upstream` block usable (the default `close` disables it).
            proxy_set_header Connection        "";
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # Root health namespace (autopilot probes /health, /health/ai, ...).
        location /health {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
            access_log off;
        }

        # Prometheus scrape endpoint (keep host-restricted in production).
        location /metrics {
            # Allow only loopback / the docker bridge by default; tighten to
            # your scraper's address. `deny all` after `allow`s is required.
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            deny  all;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header Connection        "";
        }

        # ── Socket.IO (WebSocket + polling) ───────────────────────────────────
        # Long timeouts + buffering off; the $connection_upgrade map emits the
        # correct Connection header for both the polling handshake and the WS
        # upgrade. Disabling proxy_buffering stops the 1 s+ relay latency that
        # breaks the live tick cadence.
        location /socket.io/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering   off;
            proxy_cache       off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── AI engine (FastAPI) ───────────────────────────────────────────────
        # Trailing slash on proxy_pass STRIPS the matched `/ai/` prefix:
        #   /ai/api/v1/predict  ->  http://ai-engine:8000/api/v1/predict
        # This mirrors the client-app/server.js proxy so browser and SSR paths
        # behave identically.
        location /ai/ {
            proxy_pass http://ai_engine/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
            proxy_read_timeout 120s;
        }

        # ── Frontend (Next.js) ────────────────────────────────────────────────
        # Catch-all LAST. Next's server.js also proxies /api, /ai, /socket.io,
        # but nginx handles those above so requests never take the double hop.
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_read_timeout 120s;
        }
    }
}
