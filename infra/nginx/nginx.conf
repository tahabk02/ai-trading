# Standard Nginx Proxy for Microservices
worker_processes auto;
events { worker_connections 1024; }

http {
    upstream backend {
        server core-backend:4000;
    }

    upstream ai_engine {
        server ai-engine:8001;
    }

    server {
        listen 80;

        location /api/v1/signals {
            proxy_pass http://backend;
        }

        location /api/v1/analyze {
            proxy_pass http://ai_engine;
        }

        location /socket.io/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }

        location / {
            proxy_pass http://client-app:3000;
        }
    }
}
