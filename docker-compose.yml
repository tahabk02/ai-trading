networks:
  radar_network:
    driver: bridge

services:
  # --- INFRASTRUCTURE LAYER ---
  postgres:
    image: postgres:15-alpine
    container_name: radar_db
    environment:
      TZ: UTC
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: trading_radar
    ports:
      # Host port 5432 is already owned by the native Windows PostgreSQL 17
      # service — publish on 5433 to guarantee connections reach radar_db.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - radar_network
    healthcheck:
      # Resolved INSIDE the container, so the probe always checks the real role
      # and database. A hardcoded `-U postgres` reports "accepting connections"
      # only when the role happens to be `postgres`; with DB_USER overridden it
      # would probe the wrong identity and depend on which pg_hba rule matched.
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-postgres}\" -d \"$${POSTGRES_DB:-trading_radar}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always

  redis:
    image: redis:7-alpine
    container_name: radar_bus
    ports:
      - "6379:6379"
    networks:
      - radar_network
    environment:
      TZ: UTC
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

  # --- INTELLIGENCE LAYER ---
  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: ai_brain
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis
      LOG_FORMAT: JSON
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-95.0}
      ENVIRONMENT: production
      TZ: UTC
      # P1-2026-09-24 — non-blocking interactive inference budget (ms): if a
      # cold-cache RandomForest train cannot finish within it, /predict ships
      # the fast structural verdict (inference_fallback="ml_budget_exceeded")
      # and warms the model cache in the background. 0 = legacy unbounded.
      AI_ENGINE_INFERENCE_BUDGET_MS: ${AI_ENGINE_INFERENCE_BUDGET_MS:-150}
      AI_ENGINE_API_KEY: ${AI_ENGINE_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - radar_network
    restart: always

  # --- ORCHESTRATION LAYER ---
  core-backend:
    build:
      context: ./core-backend
      dockerfile: Dockerfile
    container_name: backend_node
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-password}@postgres:5432/trading_radar?schema=public
      REDIS_HOST: redis
      REDIS_URL: redis://radar_bus:6379
      PORT: 4000
      # Container-to-container path on the radar_network. A host-loopback
      # default (127.0.0.1:8000) silently 503s every /predict inside Docker —
      # that was the recurring EADDRINUSE-era live-503 root cause. Override
      # from the repo-root .env if the engine is exposed elsewhere.
      AI_ENGINE_URL: ${AI_ENGINE_URL:-http://ai-engine:8000}
      AI_ENGINE_API_KEY: ${AI_ENGINE_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-ultra-secure-secret-key}
      POCKET_BRIDGE_HOST: pocket-bridge
      POCKET_BRIDGE_PORT: 8788
      POCKET_OPTION_SSID: ${POCKET_OPTION_SSID:-}
      POCKET_OPTION_SSID_FILE: ${POCKET_OPTION_SSID_FILE:-}
      POCKET_OPTION_UID: ${POCKET_OPTION_UID:-}
      POCKET_OPTION_IS_DEMO: ${POCKET_OPTION_IS_DEMO:-0}
      TZ: UTC
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - radar_network
    restart: always

  # --- VISUALIZATION LAYER ---
  client-app:
    build:
      context: ./client-app
      dockerfile: Dockerfile
    container_name: dashboard_ui
    environment:
      API_PROXY_URL: http://core-backend:4000
      AI_PROXY_URL: http://ai-engine:8000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: http://localhost:4000
      TZ: UTC
    ports:
      - "3000:3000"
    depends_on:
      - core-backend
    networks:
      - radar_network
    restart: always

  # --- EXECUTION LAYER ---
  # PART 43.7 [457] — OFF by default: this engine can place REAL orders, so it
  # does not start on a plain `docker compose up`. Enable explicitly with
  # `docker compose --profile execution up -d`.
  execution-engine:
    profiles: ["execution"]
    build:
      context: ./execution-engine
      dockerfile: Dockerfile
    container_name: trade_executor
    environment:
      REDIS_HOST: redis
      ENVIRONMENT: production
      TZ: UTC
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - radar_network
    restart: always

  # --- MARKET DATA LAYER (SSOT for real prices) ---
  # Pocket Option live feed bridge. Connects with the SSID cookie, streams
  # raw ticks + strict M20 candles to core-backend over the relay port.
  # Without POCKET_OPTION_SSID it runs in a clean awaiting_ssid state.
  pocket-bridge:
    build:
      context: ./pocket-bridge
      dockerfile: Dockerfile
    container_name: pocket_option_bridge
    environment:
      POCKET_BRIDGE_HOST: 0.0.0.0
      POCKET_BRIDGE_PORT: 8788
      POCKET_OPTION_SSID: ${POCKET_OPTION_SSID:-}
      # Preferred: path to the full `42["auth",{...}]` frame mounted below.
      # A file value wins over the env value, so Compose/shell quote parsing
      # can never corrupt a PHP-serialized session.
      POCKET_OPTION_SSID_FILE: ${POCKET_OPTION_SSID_FILE:-}
      POCKET_OPTION_UID: ${POCKET_OPTION_UID:-}
      POCKET_OPTION_IS_DEMO: ${POCKET_OPTION_IS_DEMO:-0}
      POCKET_OPTION_USER_AGENT: ${POCKET_OPTION_USER_AGENT:-}
      # Never inherit the SDK's 60s handshake default again; 120s lets the
      # regional endpoint rotation reach a healthy host.
      POCKET_OPTION_INIT_TIMEOUT: ${POCKET_OPTION_INIT_TIMEOUT:-120}
      POCKET_OPTION_TIMEOUT_SECS: ${POCKET_OPTION_TIMEOUT_SECS:-30}
      POCKET_OPTION_RECONNECT_TIME: ${POCKET_OPTION_RECONNECT_TIME:-3}
      # 25s keepalive inside PO's 60s idle window; recycle at 50s of silence.
      POCKET_BRIDGE_HEARTBEAT_INTERVAL: ${POCKET_BRIDGE_HEARTBEAT_INTERVAL:-25}
      POCKET_BRIDGE_STREAM_STALE_SECS: ${POCKET_BRIDGE_STREAM_STALE_SECS:-50}
      TZ: UTC
    env_file:
      - ./pocket-bridge/.env
    volumes:
      # Captured browser session (read-only): the bridge authenticates with the
      # stored `ssid` cookie and hot-reloads it; refresh runs INSIDE the
      # container against this same file.
      - ./pocket-bridge/session:/app/session:ro
      # Quote-safe SSID file. Set POCKET_OPTION_SSID_FILE to
      # /run/secrets/pocket_option_ssid to use it (contents are gitignored).
      - ./pocket-bridge/secrets:/run/secrets:ro
    ports:
      - "8788:8788"
      - "8789:8789"   # /health endpoint (relay_port + 1)
    networks:
      - radar_network
    restart: always

volumes:
  postgres_data:
