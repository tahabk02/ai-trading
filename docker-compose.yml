networks:
  radar_network:
    driver: bridge

services:
  # --- INFRASTRUCTURE LAYER ---
  postgres:
    image: postgres:15-alpine
    container_name: radar_db
    environment:
      TZ: UTC
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: trading_radar
    ports:
      # Host port 5432 is already owned by the native Windows PostgreSQL 17
      # service — publish on 5433 to guarantee connections reach radar_db.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - radar_network
    healthcheck:
      # Resolved INSIDE the container, so the probe always checks the real role
      # and database. A hardcoded `-U postgres` reports "accepting connections"
      # only when the role happens to be `postgres`; with DB_USER overridden it
      # would probe the wrong identity and depend on which pg_hba rule matched.
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-postgres}\" -d \"$${POSTGRES_DB:-trading_radar}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always

  redis:
    image: redis:7-alpine
    container_name: radar_bus
    ports:
      - "6379:6379"
    networks:
      - radar_network
    environment:
      TZ: UTC
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

  # --- INTELLIGENCE LAYER ---
  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: ai_brain
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis
      LOG_FORMAT: JSON
      CONFIDENCE_THRESHOLD: 0.98
      # PART 48 [env-hardening] — the dev stack is DEVELOPMENT, and the engine's
      # boot guard no longer keys security on this label. The old value
      # ("production") made the auth path answer 503 for every service call
      # because no key was provided; a free-text posture must never decide
      # auth, so auth is now gated by the explicit flag and the key below.
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # Required: the engine refuses to boot without it (config.py boot guard),
      # and it MUST match core-backend's AI_ENGINE_API_KEY.
      AI_ENGINE_API_KEY: ${AI_ENGINE_API_KEY:?AI_ENGINE_API_KEY must be set (repo-root .env or environment) and must match core-backend}
      TZ: UTC
      # P1-2026-09-24 — non-blocking interactive inference budget (ms): if a
      # cold-cache RandomForest train cannot finish within it, /predict ships
      # the fast structural verdict (inference_fallback="ml_budget_exceeded")
      # and warms the model cache in the background. 0 = legacy unbounded.
      AI_ENGINE_INFERENCE_BUDGET_MS: ${AI_ENGINE_INFERENCE_BUDGET_MS:-150}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - radar_network
    restart: always

  # --- ORCHESTRATION LAYER ---
  core-backend:
    build:
      context: ./core-backend
      dockerfile: Dockerfile
    container_name: backend_node
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-password}@postgres:5432/trading_radar?schema=public
      REDIS_HOST: redis
      REDIS_URL: redis://radar_bus:6379
      PORT: 4000
      # PART 48 [env-hardening] — make the posture explicit instead of inferred.
      # core-backend's boot guard is now fatal in EVERY environment (see
      # secrets.ts), so the previously "unset NODE_ENV ⇒ dev posture" hole is
      # closed regardless; this just states the intent plainly.
      NODE_ENV: ${NODE_ENV:-development}
      # Container-to-container path on the radar_network. A host-loopback
      # default (127.0.0.1:8000) silently 503s every /predict inside Docker —
      # that was the recurring EADDRINUSE-era live-503 root cause. Override
      # from the repo-root .env if the engine is exposed elsewhere.
      AI_ENGINE_URL: ${AI_ENGINE_URL:-http://ai-engine:8000}
      # Required, and it MUST equal the engine's AI_ENGINE_API_KEY. Omitted
      # before, so the strict boot guard would FATAL; a silent fallback here
      # would authenticate nothing.
      AI_ENGINE_API_KEY: ${AI_ENGINE_API_KEY:?AI_ENGINE_API_KEY must be set (repo-root .env or environment)}
      # `:?` replaces the old `${JWT_SECRET:-ultra-secure-secret-key}` silent
      # weak default — a known-constant signing key made every issued token
      # forgeable and, with no NODE_ENV above, the old guard never tripped.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (repo-root .env or environment)}
      POCKET_BRIDGE_HOST: pocket-bridge
      POCKET_BRIDGE_PORT: 8788
      POCKET_OPTION_SSID: ${POCKET_OPTION_SSID:-}
      POCKET_OPTION_UID: ${POCKET_OPTION_UID:-}
      POCKET_OPTION_IS_DEMO: ${POCKET_OPTION_IS_DEMO:-0}
      TZ: UTC
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - radar_network
    restart: always

  # --- VISUALIZATION LAYER ---
  client-app:
    build:
      context: ./client-app
      dockerfile: Dockerfile
    container_name: dashboard_ui
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: http://localhost:4000
      TZ: UTC
    ports:
      - "3000:3000"
    depends_on:
      - core-backend
    networks:
      - radar_network
    restart: always

  # --- EXECUTION LAYER ---
  # PART 43.7 [457] — OFF by default: this engine can place REAL orders, so it
  # does not start on a plain `docker compose up`. Enable explicitly with
  # `docker compose --profile execution up -d`.
  execution-engine:
    profiles: ["execution"]
    build:
      context: ./execution-engine
      dockerfile: Dockerfile
    container_name: trade_executor
    environment:
      REDIS_HOST: redis
      ENVIRONMENT: production
      TZ: UTC
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - radar_network
    restart: always

  # --- MARKET DATA LAYER (SSOT for real prices) ---
  # Pocket Option live feed bridge. Connects with the SSID cookie, streams
  # raw ticks + strict M20 candles to core-backend over the relay port.
  # Without POCKET_OPTION_SSID it runs in a clean awaiting_ssid state.
  pocket-bridge:
    build:
      context: ./pocket-bridge
      dockerfile: Dockerfile
    container_name: pocket_option_bridge
    environment:
      POCKET_BRIDGE_HOST: 0.0.0.0
      POCKET_BRIDGE_PORT: 8788
      TZ: UTC
    env_file:
      - ./pocket-bridge/.env
    volumes:
      # Captured browser session, READ-WRITE: the bridge authenticates with the
      # stored `ssid` cookie and hot-reloads it, while refresh_ssid.py (run
      # INSIDE the container against this same file) atomically rotates
      # po_session.json so the refreshed token survives container restarts.
      - ./pocket-bridge/session:/app/session
    ports:
      - "8788:8788"
      - "8789:8789"   # /health endpoint (relay_port + 1)
    networks:
      - radar_network
    restart: always

volumes:
  postgres_data:
